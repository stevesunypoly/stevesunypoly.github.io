<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steven M. Schneider</title>
<style>
  body {
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f9f9f9;
    color: #333;
  }
  h1 { font-size: 1.4em; font-weight: normal; margin-bottom: 0.5em; }
  p { font-size: 1em; color: #666; margin: 0.3em 0; }
  #count {
    font-size: 4em;
    font-weight: bold;
    margin: 0.4em 0;
    color: #333;
  }
  a {
    margin-top: 1em;
    font-size: 0.9em;
    color: #555;
    text-decoration: none;
    border-bottom: 1px solid #aaa;
    cursor: pointer;
  }
  a:hover { color: #000; }
</style>
</head>
<body>
<h1>Steven M. Schneider</h1>
<p>This page has moved.</p>
<div id="count">5</div>
<p>Redirecting to <strong>sunypolysteve.github.io</strong></p>
<a id="stay" href="stevesunypoly.html">Stay Here</a>
<script>
  let n = 5;
  const el = document.getElementById('count');
  const stay = document.getElementById('stay');
  const t = setInterval(() => {
    n--;
    el.textContent = n;
    if (n <= 0) {
      clearInterval(t);
      window.location = 'https://sunypolysteve.github.io';
    }
  }, 1000);
  stay.addEventListener('click', () => {
    clearInterval(t);
  });
</script>
</body>
</html>
